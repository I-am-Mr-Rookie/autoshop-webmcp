<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Schematic of parts flowing through an agent node to a human approval switch and a receipt">
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0v16" fill="none" stroke="#e2e8ec" stroke-width="1"/></pattern>
    <symbol id="cpu" viewBox="0 0 84 80">
      <g fill="none" stroke="#1d2b34" stroke-width="1.5">
        <g stroke="#aeb9c1"><path d="M14 8V1M28 8V1M42 8V1M56 8V1M70 8V1M14 72v7M28 72v7M42 72v7M56 72v7M70 72v7M8 20H1M8 34H1M8 48H1M8 62H1M76 20h7M76 34h7M76 48h7M76 62h7"/></g>
        <rect x="8" y="8" width="68" height="64" rx="4" fill="#fff"/>
        <rect x="20" y="20" width="44" height="40" rx="2" fill="#e6f4ee" stroke="#047857"/>
        <rect x="32" y="30" width="20" height="20" fill="#fff" stroke="#047857"/>
      </g>
    </symbol>
    <symbol id="ram" viewBox="0 0 160 52">
      <g fill="none" stroke="#1d2b34" stroke-width="1.5" stroke-linejoin="round">
        <path d="M2 2h156v38H108l-4 6h-6l-4-6H2z" fill="#e6f4ee" stroke="#047857"/>
        <g fill="#fff"><rect x="10" y="10" width="16" height="20" rx="1.5"/><rect x="34" y="10" width="16" height="20" rx="1.5"/><rect x="58" y="10" width="16" height="20" rx="1.5"/><rect x="82" y="10" width="16" height="20" rx="1.5"/><rect x="106" y="10" width="16" height="20" rx="1.5"/><rect x="130" y="10" width="16" height="20" rx="1.5"/></g>
        <g stroke="#b45309" stroke-width="2"><path d="M8 40v6M14 40v6M20 40v6M26 40v6M32 40v6M38 40v6M44 40v6M50 40v6M56 40v6M62 40v6M68 40v6M74 40v6M80 40v6M86 40v6M116 40v6M122 40v6M128 40v6M134 40v6M140 40v6M146 40v6M152 40v6"/></g>
      </g>
    </symbol>
    <symbol id="ssd" viewBox="0 0 150 44">
      <g fill="none" stroke="#1d2b34" stroke-width="1.5" stroke-linejoin="round">
        <path d="M12 4h132a3 3 0 0 1 3 3v30a3 3 0 0 1-3 3H12z" fill="#e6f4ee" stroke="#047857"/>
        <circle cx="138" cy="22" r="4" fill="#fff" stroke="#aeb9c1"/>
        <rect x="24" y="12" width="20" height="20" rx="1.5" fill="#fff"/>
        <rect x="54" y="10" width="30" height="24" rx="1.5" fill="#fff"/>
        <rect x="92" y="10" width="30" height="24" rx="1.5" fill="#fff"/>
        <g stroke="#b45309" stroke-width="2"><path d="M12 8H4M12 12H4M12 16H4M12 20H4M12 28H4M12 32H4M12 36H4"/></g>
      </g>
    </symbol>
  </defs>
  <rect width="560" height="440" rx="4" fill="#f7f9fa"/>
  <rect width="560" height="440" fill="url(#g)"/>

  <!-- catalogue shelf -->
  <g>
    <rect x="34" y="40" width="200" height="330" rx="4" fill="#ffffff" stroke="#d7dee3" stroke-width="1.5"/>
    <path d="M34 72h200" stroke="#d7dee3" stroke-width="1.5"/>
    <rect x="48" y="52" width="60" height="8" rx="1.5" fill="#e2e8ec"/>
    <use href="#cpu" x="92" y="88" width="84" height="80"/>
    <use href="#ram" x="54" y="198" width="160" height="52"/>
    <use href="#ssd" x="58" y="282" width="150" height="44"/>
    <!-- stock ticks -->
    <g fill="#047857"><circle cx="50" cy="128" r="3"/><circle cx="50" cy="224" r="3"/><circle cx="50" cy="304" r="3"/></g>
    <path d="M58 128h12M58 224h12M58 304h12" stroke="#9ed3bd" stroke-width="2"/>
  </g>

  <!-- traces from shelf to agent node -->
  <g fill="none" stroke="#9ed3bd" stroke-width="2" stroke-dasharray="5 5">
    <path d="M234 128h30a10 10 0 0 1 10 10v58a10 10 0 0 0 10 10h16"/>
    <path d="M234 224h30a10 10 0 0 0 10-10v-8a10 10 0 0 1 10-10h16"/>
    <path d="M234 304h30a10 10 0 0 0 10-10v-78a10 10 0 0 1 10-10h16"/>
  </g>

  <!-- agent node -->
  <g>
    <circle cx="330" cy="206" r="32" fill="#ffffff" stroke="#047857" stroke-width="2.5"/>
    <circle cx="330" cy="206" r="22" fill="#e6f4ee" stroke="#047857" stroke-width="1.5"/>
    <path d="M318 206h24M330 194v24" stroke="#047857" stroke-width="2"/>
    <rect x="292" y="252" width="76" height="16" rx="2" fill="#e6f4ee" stroke="#9ed3bd"/>
    <path d="M300 260h60" stroke="#047857" stroke-width="2"/>
  </g>

  <!-- trace agent → human switch (green fading to amber) -->
  <path d="M362 206h56" fill="none" stroke="#9ed3bd" stroke-width="2.5"/>
  <path d="M418 206h30" fill="none" stroke="#ecc48f" stroke-width="2.5"/>

  <!-- human switch -->
  <g>
    <rect x="448" y="150" width="74" height="112" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="460" y="162" width="50" height="68" rx="25" fill="#fbf0e1" stroke="#ecc48f" stroke-width="1.5"/>
    <circle cx="485" cy="206" r="18" fill="#b45309"/>
    <path d="M478 206l5 5 9-10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M462 244h46" stroke="#ecc48f" stroke-width="2"/>
    <rect x="448" y="120" width="74" height="18" rx="2" fill="#fbf0e1" stroke="#ecc48f" stroke-width="1.5"/>
    <path d="M458 129h54" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- receipt drop -->
  <path d="M485 262v30" fill="none" stroke="#9ed3bd" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M458 296h54v40l-6-4-6 4-6-4-6 4-6-4-6 4-6-4-6 4z" fill="#e6f4ee" stroke="#047857" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M468 308h34M468 318h22" stroke="#047857" stroke-width="2"/>

  <!-- boundary line -->
  <path d="M418 60v340" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="384" y="52" width="68" height="16" rx="2" fill="#ffffff" stroke="#ecc48f" stroke-width="1.5"/>
  <path d="M392 60h52" stroke="#b45309" stroke-width="2"/>
</svg>
